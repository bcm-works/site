#
# GitHub Actions Workflow: Deploy
#   - Builds the static site
#   - Runs Deno tests
#   - Deploys the public directory to Cloudflare Pages
#

name: Deploy
run-name: Deploy ${{ github.run_number }} from ${{ github.actor }} on ${{ github.ref_name }}

on:
  # Trigger when a new commit is pushed to the 'main' branch.
  push:
    branches:
      - main
  # Manual trigger via GitHub Repo > Actions > Deploy > Run workflow
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    environment: ci-build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: Run Deno Install
        run: deno task install

      - name: Run Deno Build
        run: deno task build

      - name: Run Deno Tests
        run: deno task test

      - name: Build Site
        env:
          SITE_ENV: production
          SITE_AUTHOR: ${{ secrets.SITE_AUTHOR }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_LANG: ${{ secrets.SITE_LANG }}
          SITE_FEED_TITLE: ${{ secrets.SITE_FEED_TITLE }}
          SITE_FEED_DESC: ${{ secrets.SITE_FEED_DESC }}
          SITE_FEED_DEFAULT_TITLE: ${{ secrets.SITE_FEED_DEFAULT_TITLE }}
          SITE_POSTHOG_ID: ${{ secrets.SITE_POSTHOG_ID }}
          SITE_POSTHOG_API_HOST: ${{ secrets.SITE_POSTHOG_API_HOST }}
          SITE_POSTHOG_UI_HOST: ${{ secrets.SITE_POSTHOG_UI_HOST }}
        run: deno task build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        env:
          DO_NOT_TRACK: 1
          WRANGLER_SEND_METRICS: false
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

