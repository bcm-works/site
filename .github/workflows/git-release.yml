#
#
# GitHub Actions Workflow: Git Release
#   - Initial setup is required, refer to: src/git/README.md > Infrastructure
#
#

name: Git Release
run-name: Git Release by ${{ github.actor }} on ${{ github.ref_name }}

on:
  # Manual run via GitHub Repo > Actions > Git Release > Run workflow
  workflow_dispatch:
    inputs:
      continue_deployment:
        description: 'Confirm production deployment for Git service'
        type: boolean
        required: true
        default: false

defaults:
  run:
    working-directory: src/git
    shell: bash

permissions:
  contents: read

jobs:
  git-gcp:
    name: Deploy Git to GCP
    if: ${{ inputs.continue_deployment == true }}
    runs-on: ubuntu-latest
    environment:
      name: gcp-cloud-run
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
      - name: Google Cloud login
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GIT_GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GIT_GCP_SERVICE_ACCOUNT_JSON }}
      - name: Google Cloud setup
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy using Compose
        run: |
          gcloud run compose up --file=docker-compose.prod.yml --region=${{ secrets.GIT_GCP_REGION }}
      - name: Cloud Run deployment
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ secrets.GIT_GCP_CLOUD_RUN_SERVICE_NAME }}
          region: ${{ secrets.GIT_GCP_REGION }}
          image: ${{ secrets.GIT_GCP_DOCKER_IMAGE_URL }}/${{ secrets.GIT_DOCKER_IMAGE_PATH }}:commit-${{ needs.setup.outputs.COMMIT }}
