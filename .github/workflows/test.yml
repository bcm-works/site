#
#
# GitHub Actions Workflow: Test
#   - Includes the build and test processes
#
#

name: Test
run-name: Test by ${{ github.actor }} on ${{ github.ref_name }}

on:
  # Manual run via GitHub Repo > Actions > Test > Run workflow
  workflow_dispatch:
  # Automatically run on PRs that are targetting 'main'
  pull_request:
    branches:
      - main
    paths:
      - src/
      - .mise/tasks/build
      - .mise/tasks/docker/build
      - deno.jsonc
      - deno.lock
      - .dockerignore
      - Dockerfile

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    outputs:
      TIMESTAMP: ${{ steps.vars.outputs.TIMESTAMP }}
      COMMIT: ${{ steps.vars.outputs.COMMIT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
      - name: Set workflow variables
        id: vars
        run: |
          echo "TIMESTAMP=$(TZ='Australia/Sydney' date +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
      - name: Mise setup
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          chmod +x ${{ github.workspace }}/.config/mise/tasks/*
          chmod +x ${{ github.workspace }}/.config/mise/tasks/**/*
          mise trust ${{ github.workspace }}/.config/mise/config.toml
      - name: Deno setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install dependencies
        run: deno ci --quiet
      - name: Build site
        run: mise run build
      - name: Docker build
        run: deno task docker-build
      - name: Run tests
        run: deno task test
