#
#
# GitHub Actions Workflow: Release
#   - Includes the build, test, deploy, and release processes
#   - Initial setup is required, refer to README.md
#
#

name: Release
run-name: Release by ${{ github.actor }} on ${{ github.ref_name }}

on:
  # Manual run via GitHub Repo > Actions > Release > Run workflow
  workflow_dispatch:
    inputs:
      continue_deployment:
        description: 'Confirm production deployment and release'
        type: boolean
        required: true
        default: false

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Test
    if: ${{ inputs.continue_deployment == true }}
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    outputs:
      TIMESTAMP: ${{ steps.vars.outputs.TIMESTAMP }}
      COMMIT: ${{ steps.vars.outputs.COMMIT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set workflow variables
        id: vars
        run: |
          echo "TIMESTAMP=$(TZ='Australia/Sydney' date +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
      - name: Nub setup
        uses: nubjs/setup-nub@v0
      - name: Deno setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install dependencies
        run: nub run deps-install
      - name: Build site
        run: nub run build
      - name: Docker build
        run: nub run docker-build
      - name: Run tests
        run: deno task test
  push-docker:
    name: Push to GitHub Packages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_DEPLOY_TOKEN }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            latest
            branch-${{ github.ref_name }}
            commit-${{ needs.build.outputs.COMMIT }}
            release-${{ needs.build.outputs.TIMESTAMP }}
          labels: |
            maintainer=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ secrets.SITE_TITLE }}
            org.opencontainers.image.description=${{ secrets.SITE_DESC }}
            org.opencontainers.image.authors=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.vendor=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.url=${{ secrets.SITE_REPO }}
            org.opencontainers.image.source=${{ secrets.SITE_REPO }}
            org.opencontainers.image.version=${{ needs.build.outputs.TIMESTAMP }}
            org.opencontainers.image.revision=${{ needs.build.outputs.COMMIT }}
      - name: Build and push Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/src/Site.Dockerfile
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          pull: true
          push: true
          build-args: |
            SITE_URL=${{ secrets.SITE_URL }}
            SITE_PORT=${{ secrets.SITE_PORT }}
            SITE_FEED_TITLE=${{ secrets.SITE_FEED_TITLE }}
            SITE_FEED_DESC=${{ secrets.SITE_FEED_DESC }}
            SITE_FEED_DEFAULT_TITLE=${{ secrets.SITE_FEED_DEFAULT_TITLE }}
            SITE_LANG=${{ secrets.SITE_LANG }}
            SITE_AUTHOR=${{ secrets.SITE_AUTHOR }}
            SITE_POSTHOG_ID=${{ secrets.SITE_POSTHOG_ID }}
            SITE_POSTHOG_API_HOST=${{ secrets.SITE_POSTHOG_API_HOST }}
            SITE_POSTHOG_UI_HOST=${{ secrets.SITE_POSTHOG_UI_HOST }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy-railway:
    name: Deploy to Railway
    needs: [build, push-docker]
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    environment:
      name: ci-deploy-railway
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      DO_NOT_TRACK: 1
      RAILWAY_NO_TELEMETRY: 1
      RAILWAY_TOKEN: ${{ secrets.SITE_RAILWAY_PROJECT_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Railway login
        run: |
          railway link \
            --service ${{ secrets.SITE_RAILWAY_SERVICE }} \
            --json
      - name: Railway redeploy
        run: |
          railway redeploy \
            --service ${{ secrets.SITE_RAILWAY_SERVICE }} \
            --yes \
            --json

  release-github:
    name: Create Release
    needs: [build, push-docker, deploy-railway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Nub setup
        uses: nubjs/setup-nub@v0
      - name: Install dependencies
        run: nub ci
      - name: Generate release notes
        working-directory: ${{ github.workspace }}
        run: nub run release-notes
      - name: Create release tag
        run: |
          git config user.name "bot-release"
          git config user.email "brendan+bot-release@bcm.works"
          git tag release-${{ needs.build.outputs.TIMESTAMP }}
          git push --tags --quiet
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.build.outputs.TIMESTAMP }}
          tag: release-${{ needs.build.outputs.TIMESTAMP }}
          bodyFile: ${{ github.workspace }}/release-notes.log
          makeLatest: true
