#
#
# GitHub Actions Workflow: Release
#   - Includes the build, test, deploy, and release processes
#   - Initial setup is required, refer to README.md
#
#

name: Release
run-name: Release ${{ github.run_number }} from ${{ github.actor }} on the ${{ github.ref_name }} ${{ github.ref_type }}

on:
  # Manual run via GitHub Repo > Actions > Release > Run workflow
  workflow_dispatch:
    inputs:
      continue_deployment:
        description: 'Confirm production deployment'
        type: boolean
        required: true
        default: false

concurrency:
  group: release
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Confirmed
        if: ${{ inputs.continue_deployment != true }}
        run: echo "Not confirmed by the user" && exit 1
      - name: Branch
        if: ${{ github.ref_name != 'main' }}
        run: echo "Not on the 'main' branch" && exit 1

  build:
    name: Build and Test
    needs: [check]
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    permissions:
      contents: read
    outputs:
      TIMESTAMP: ${{ steps.vars.outputs.TIMESTAMP }}
      COMMIT: ${{ steps.vars.outputs.COMMIT }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Variables
        id: vars
        run: |
          echo "TIMESTAMP=$(TZ='Australia/Sydney' date +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install Dependencies
        run: deno ci
      - name: Build Site
        run: deno task build
      - name: Build Docker
        run: deno task docker-build
      - name: Test
        run: deno task test

  push-docker:
    name: Push to GitHub Packages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_DEPLOY_TOKEN }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/${{ secrets.PACKAGES_IMAGE_PATH }}
          tags: |
            latest
            branch-${{ github.ref_name }}
            commit-${{ needs.build.outputs.COMMIT }}
            release-${{ needs.build.outputs.TIMESTAMP }}
          labels: |
            maintainer=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ secrets.SITE_TITLE }}
            org.opencontainers.image.description=${{ secrets.SITE_DESC }}
            org.opencontainers.image.authors=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.vendor=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.url=${{ secrets.SITE_REPO }}
            org.opencontainers.image.source=${{ secrets.SITE_REPO }}
            org.opencontainers.image.version=${{ needs.build.outputs.TIMESTAMP }}
            org.opencontainers.image.revision=${{ needs.build.outputs.COMMIT }}
      - name: Build and push Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}
          file: ${{ github.workspace }}/src/Site.Dockerfile
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          pull: true
          push: true
          build-args: |
            SITE_URL=${{ secrets.SITE_URL }}
            SITE_PORT=${{ secrets.SITE_PORT }}
            SITE_FEED_TITLE=${{ secrets.SITE_FEED_TITLE }}
            SITE_FEED_DESC=${{ secrets.SITE_FEED_DESC }}
            SITE_FEED_DEFAULT_TITLE=${{ secrets.SITE_FEED_DEFAULT_TITLE }}
            SITE_LANG=${{ secrets.SITE_LANG }}
            SITE_AUTHOR=${{ secrets.SITE_AUTHOR }}
            SITE_BUILD_ID=${{ needs.build.outputs.TIMESTAMP }}
            SITE_POSTHOG_ID=${{ secrets.SITE_POSTHOG_ID }}
            SITE_POSTHOG_API_HOST=${{ secrets.SITE_POSTHOG_API_HOST }}
            SITE_POSTHOG_UI_HOST=${{ secrets.SITE_POSTHOG_UI_HOST }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  deploy-railway:
    name: Deploy to Railway
    needs: [build, push-docker]
    runs-on: ubuntu-latest
    environment:
      name: ci-deploy-railway
      deployment: false
    permissions:
      contents: read
      id-token: write
    env:
      DO_NOT_TRACK: 1
      RAILWAY_NO_TELEMETRY: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Railway Setup
        run: bash <(curl -fsSL railway.com/install.sh) -y
      - name: Railway Redeploy
        run: |
          export RAILWAY_TOKEN=${{ secrets.SITE_RAILWAY_PROJECT_TOKEN }}
          echo "::add-mask::$RAILWAY_TOKEN"
          ~/.railway/bin/railway variables \
            --set "SITE_BUILD_ID=${{ needs.build.outputs.TIMESTAMP }}" \
            --service ${{ secrets.SITE_RAILWAY_SERVICE }}

  release-github:
    name: Create Release
    needs: [build, push-docker, deploy-railway]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install Dependencies
        run: deno ci
      - name: Generate Release Notes
        working-directory: ${{ github.workspace }}
        run: deno task release-notes
      - name: Create Release Tag
        run: |
          git config user.name "bot-release"
          git config user.email "brendan+bot-release@bcm.works"
          git tag release-${{ needs.build.outputs.TIMESTAMP }}
          git push --tags --quiet
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.build.outputs.TIMESTAMP }}
          tag: release-${{ needs.build.outputs.TIMESTAMP }}
          bodyFile: ${{ github.workspace }}/release-notes.log
          makeLatest: true
