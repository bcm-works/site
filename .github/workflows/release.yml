#
#
# GitHub Actions Workflow: Release
#   - Includes the build, test, deploy, and release processes
#   - Initial setup is required, refer to README.md
#
#

name: Release
run-name: Release ${{ github.run_number }} from ${{ github.actor }} on the ${{ github.ref_name }} ${{ github.ref_type }}

on:
  # Manual run via GitHub Repo > Actions > Release > Run workflow
  workflow_dispatch:
    inputs:
      continue_deployment:
        description: 'Confirm production deployment'
        type: boolean
        required: true
        default: false

concurrency:
  group: release
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BUILD_TAG_PREFIX: "release-"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Confirmed
        if: ${{ inputs.continue_deployment != true }}
        run: echo "Not confirmed by the user" && exit 1
      - name: Branch
        if: ${{ github.ref_name != 'main' }}
        run: echo "Not on the 'main' branch" && exit 1

  build:
    name: Build and Test
    needs: [check]
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    permissions:
      contents: read
    outputs:
      BUILD_ID: ${{ steps.vars.outputs.BUILD_ID }}
      BUILD_COMMIT: ${{ steps.vars.outputs.BUILD_COMMIT }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 1
          show-progress: false
      - name: Set Variables
        id: vars
        run: |
          echo "BUILD_ID=$(TZ='Australia/Sydney' date +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
          echo "BUILD_COMMIT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Run Tests
        run: ./task test

  deploy-deno:
    name: Deno Deploy
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: ci-deploy-deno
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 1
          show-progress: false
      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Deploy
        run: |
          deno deploy \
            env update-value SITE_BUILD_ID "${{ needs.build.outputs.BUILD_ID }}" \
            --token ${{ secrets.DENO_DEPLOY_TOKEN }} \
            --json \
            --non-interactive \
            --org ${{ secrets.DENO_DEPLOY_ORG }} \
            --app ${{ secrets.DENO_DEPLOY_APP }}
          deno deploy \
            --token ${{ secrets.DENO_DEPLOY_TOKEN }} \
            --json \
            --non-interactive \
            --org ${{ secrets.DENO_DEPLOY_ORG }} \
            --app ${{ secrets.DENO_DEPLOY_APP }} \
            --prod

  release-github:
    name: Release
    needs: [build, deploy-deno]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 100
          fetch-tags: true
          show-progress: false
      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install Dependencies
        run: deno ci
      - name: Generate Release Notes
        working-directory: ${{ github.workspace }}
        run: |
          TAG_PREV=$(git tag -l "${{ env.BUILD_TAG_PREFIX }}*" --sort=-creatordate | head -n 1)
          git log "$TAG_PREV..HEAD" \
            --oneline --no-merges \
            --format="- [%h](${{ github.server_url }}/${{ github.repository }}/commit/%H) %s" \
            > "${{ github.workspace }}/release-notes.log"
          cat ${{ github.workspace }}/release-notes.log
      - name: Create Release Tag
        run: |
          git config user.name "bot-release"
          git config user.email "brendan+bot-release@bcm.works"
          git tag ${{ env.BUILD_TAG_PREFIX }}${{ needs.build.outputs.BUILD_ID }}
          git push --tags --quiet
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.build.outputs.BUILD_ID }}
          tag: ${{ env.BUILD_TAG_PREFIX }}${{ needs.build.outputs.BUILD_ID }}
          bodyFile: ${{ github.workspace }}/release-notes.log
          makeLatest: true
