#
#
# GitHub Actions Workflow: Release
#   - This workflow includes the build, test, deploy, and release processes
#   - Initial setup is required, refer to README.md
#
#

name: Release
run-name: Release by ${{ github.actor }} on ${{ github.ref_name }}

on:
  # Manual run via GitHub Repo > Actions > Release > Run workflow
  workflow_dispatch:
    inputs:
      continue_deployment:
        description: 'Confirm production deployment and release'
        type: boolean
        required: true
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  site-build:
    name: Build
    if: ${{ inputs.continue_deployment == true }}
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    outputs:
      TIMESTAMP: ${{ steps.vars.outputs.TIMESTAMP }}
      COMMIT: ${{ steps.vars.outputs.COMMIT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
      - name: Set workflow variables
        id: vars
        run: |
          echo "TIMESTAMP=$(TZ='Australia/Sydney' date +%Y%m%d.%H%M)" >> $GITHUB_OUTPUT
          echo "COMMIT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_OUTPUT
      - name: Mise setup
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          chmod +x ${{ github.workspace }}/.mise/tasks/*
          chmod +x ${{ github.workspace }}/.mise/tasks/**/*
          mise trust ${{ github.workspace }}/.mise/config.toml
      - name: Deno setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install dependencies
        run: deno ci --quiet
      - name: Build site
        run: mise run build
      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.vars.outputs.COMMIT }}
          overwrite: true
          include-hidden-files: true
          retention-days: 1
          compression-level: 9
          path: |
            src/site/public
            src/site/.env
  site-test:
    name: Test
    needs: site-build
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          name: build-${{ needs.site-build.outputs.COMMIT }}
          path: ${{ github.workspace }}/src/site
      - name: Deno setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Run tests
        run: deno task test

  site-docker-hub:
    name: Push to Docker Hub
    needs: [site-build, site-test]
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive
      - name: Docker Hub login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.SITE_DOCKER_IMAGE_PATH }}
          tags: |
            latest
            branch-${{ github.ref_name }}
            commit-${{ needs.site-build.outputs.COMMIT }}
            release-${{ needs.site-build.outputs.TIMESTAMP }}
          labels: |
            maintainer=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=${{ secrets.SITE_TITLE }}
            org.opencontainers.image.description=${{ secrets.SITE_DESC }}
            org.opencontainers.image.authors=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.vendor=${{ secrets.SITE_AUTHOR }}
            org.opencontainers.image.url=${{ secrets.SITE_REPO }}
            org.opencontainers.image.source=${{ secrets.SITE_REPO }}
            org.opencontainers.image.version=${{ needs.site-build.outputs.TIMESTAMP }}
            org.opencontainers.image.revision=${{ needs.site-build.outputs.COMMIT }}
      - name: Build and push Docker Image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/src/site
          file: ${{ github.workspace }}/src/site/Dockerfile
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          pull: true
          push: true
          build-args: |
            SITE_URL=${{ secrets.SITE_URL }}
            SITE_PORT=${{ secrets.SITE_PORT }}
            SITE_FEED_TITLE=${{ secrets.SITE_FEED_TITLE }}
            SITE_FEED_DESC=${{ secrets.SITE_FEED_DESC }}
            SITE_FEED_DEFAULT_TITLE=${{ secrets.SITE_FEED_DEFAULT_TITLE }}
            SITE_LANG=${{ secrets.SITE_LANG }}
            SITE_AUTHOR=${{ secrets.SITE_AUTHOR }}
            SITE_POSTHOG_ID=${{ secrets.SITE_POSTHOG_ID }}
            SITE_POSTHOG_API_HOST=${{ secrets.SITE_POSTHOG_API_HOST }}
            SITE_POSTHOG_UI_HOST=${{ secrets.SITE_POSTHOG_UI_HOST }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Release
    needs: [site-build, site-test, site-docker-hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create release tag
        run: |
          git config user.name "bot-release"
          git config user.email "brendan+bot-release@bcm.works"
          git tag release-${{ needs.site-build.outputs.TIMESTAMP }}
          git push --tags --quiet
      - name: Install and setup Mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          chmod +x ${{ github.workspace }}/.mise/tasks/*
          chmod +x ${{ github.workspace }}/.mise/tasks/**/*
          mise trust ${{ github.workspace }}/.mise/config.toml
      - name: Generate release notes
        working-directory: ${{ github.workspace }}
        run: mise run release-notes ${{ github.workspace }}/release-notes.log
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: ${{ needs.site-build.outputs.TIMESTAMP }}
          tag: release-${{ needs.site-build.outputs.TIMESTAMP }}
          bodyFile: ${{ github.workspace }}/release-notes.log
          makeLatest: true
