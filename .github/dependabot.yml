version: 2

updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    assignees:
      - "bcm-works"
    labels:
      - "ai-generated"
      - "deps"
      - "infra"
    groups:
      deps-ghactions:
        patterns:
          - "*"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
      prefix: "fix-deps-ghactions-"
      branch-name-case: "lowercase"

  - package-ecosystem: "deno"
    directories:
      - "/"
      - "/app/frontend/app"
    exclude-paths:
      - ".prototypes/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    assignees:
      - "bcm-works"
    labels:
      - "ai-generated"
      - "deps"
      - "frontend"
    groups:
      deps-deno:
        patterns:
          - "*"
    allow:
      - dependency-name: "*"
        dependency-type: "production"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
      prefix: "fix-deps-deno-"
      branch-name-case: "lowercase"

  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    assignees:
      - "bcm-works"
    labels:
      - "ai-generated"
      - "deps"
      - "cli"
    groups:
      deps-gomod:
        patterns:
          - "*"
    allow:
      - dependency-name: "*"
        dependency-type: "production"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    target-branch: "main"
    pull-request-branch-name:
      separator: "-"
      prefix: "fix-deps-gomod-"
      branch-name-case: "lowercase"
