# ============================================================================
# Translated from: Release workflow
# ============================================================================
#
# TRIGGER CONFIGURATION REQUIRED:
# This workflow uses workflow_dispatch with a boolean input for deployment
# confirmation. Configure in Buildkite UI:
#   1. Pipeline Settings → New Build button
#   2. Add input step (see below) or use API/UI to trigger builds
#
# CONCURRENCY:
# Enable "Cancel Intermediate Builds" in Pipeline Settings → Builds
# to replicate the cancel-in-progress behavior.
#
# PERMISSIONS REQUIRED:
# - contents: write (GitHub token with repo scope for creating releases/tags)
# - id-token: write (for Deno Deploy OIDC - configure via agent or secrets)
#
# AGENT CONFIGURATION REQUIRED:
# The original workflow used the following GitHub Actions runners:
#
#   Job                  | runs-on
#   ---------------------|----------------
#   check                | ubuntu-latest
#   build                | ubuntu-latest
#   deploy-deno          | ubuntu-latest
#   release-github       | ubuntu-latest
#
# You must configure Buildkite agents to handle these workloads. Add an
# `agents` block to each step once your queues are set up. Example:
#
#   agents:
#     queue: "linux"
#
# Required tools on agents: Deno (latest), Git, GitHub CLI (gh)
# Alternatively, use the Docker plugin with denoland/deno:latest image.
#
# SECRETS CONFIGURATION:
# Configure these as environment variables on your agents or via Buildkite secrets:
# - DENO_DEPLOY_TOKEN
# - DENO_DEPLOY_ORG
# - DENO_DEPLOY_APP
# - GITHUB_TOKEN (with repo scope for releases)
#
# ============================================================================

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

steps:
  - input: ":rocket: Release Confirmation"
    key: "release-input"
    fields:
      - select: "Confirm production deployment"
        key: "continue_deployment"
        required: true
        options:
          - label: "Yes, deploy to production"
            value: "true"
          - label: "No, cancel"
            value: "false"
        default: "false"
    if: build.source == "ui"

  - wait

  - group: ":white_check_mark: Checks"
    key: "check"
    steps:
      - label: ":mag: Validate deployment confirmation"
        key: "check-confirmed"
        command: |
          CONTINUE_DEPLOYMENT=$$(buildkite-agent meta-data get "continue_deployment" --default "false")
          if [[ "$$CONTINUE_DEPLOYMENT" != "true" ]]; then
            echo "Not confirmed by the user"
            exit 1
          fi

      - label: ":git: Validate branch"
        key: "check-branch"
        command: |
          if [[ "$$BUILDKITE_BRANCH" != "main" ]]; then
            echo "Not on the 'main' branch"
            exit 1
          fi

  - wait

  - label: ":hammer: Build and Test"
    key: "build"
    depends_on: "check"
    # Assumes Deno is installed on the agent.
    # If not available, use the Docker plugin:
    #   plugins:
    #     - docker:
    #         image: "denoland/deno:latest"
    command: |
      echo "--- :clock1: Set build variables"
      TIMESTAMP=$$(TZ='Australia/Sydney' date +%Y%m%d.%H%M)
      COMMIT=$$(git rev-parse --short $$BUILDKITE_COMMIT)
      
      echo "TIMESTAMP: $$TIMESTAMP"
      echo "COMMIT: $$COMMIT"
      
      buildkite-agent meta-data set "TIMESTAMP" "$$TIMESTAMP"
      buildkite-agent meta-data set "COMMIT" "$$COMMIT"
      
      echo "--- :test_tube: Run tests"
      ./task test

  - wait

  - label: ":rocket: Deno Deploy"
    key: "deploy-deno"
    depends_on: "build"
    # Assumes Deno is installed on the agent.
    # If not available, use the Docker plugin:
    #   plugins:
    #     - docker:
    #         image: "denoland/deno:latest"
    command: |
      TIMESTAMP=$$(buildkite-agent meta-data get "TIMESTAMP")
      
      echo "--- :gear: Update environment variable"
      deno deploy \
        env update-value \
        SITE_BUILD_ID "$$TIMESTAMP" \
        --token "$$DENO_DEPLOY_TOKEN" \
        --json \
        --non-interactive \
        --org "$$DENO_DEPLOY_ORG" \
        --app "$$DENO_DEPLOY_APP"
      
      echo "--- :rocket: Deploy to production"
      deno deploy \
        --token "$$DENO_DEPLOY_TOKEN" \
        --json \
        --non-interactive \
        --org "$$DENO_DEPLOY_ORG" \
        --app "$$DENO_DEPLOY_APP" \
        --prod

  - wait

  - label: ":github: Create GitHub Release"
    key: "release-github"
    depends_on:
      - "build"
      - "deploy-deno"
    # Assumes Deno and GitHub CLI (gh) are installed on the agent.
    # If not available, use the Docker plugin with an image containing both tools.
    command: |
      TIMESTAMP=$$(buildkite-agent meta-data get "TIMESTAMP")
      
      echo "--- :package: Install dependencies"
      deno ci
      
      echo "--- :memo: Generate release notes"
      TAG_PREV=$$(git tag -l "release-*" --sort=-creatordate | head -n 1)
      git log "$$TAG_PREV..HEAD" \
        --oneline --no-merges \
        --format="- [%h](https://github.com/$$BUILDKITE_REPO/commit/%H) %s" \
        > release-notes.log
      
      echo "Release notes:"
      cat release-notes.log
      
      echo "--- :label: Create release tag"
      git config user.name "bot-release"
      git config user.email "brendan+bot-release@bcm.works"
      git tag "release-$$TIMESTAMP"
      git push --tags --quiet
      
      echo "--- :github: Create GitHub release"
      gh release create "release-$$TIMESTAMP" \
        --title "$$TIMESTAMP" \
        --notes-file release-notes.log \
        --latest