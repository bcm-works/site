#
#
# GitHub Actions Workflow: Test
#   - Includes the build and test processes
#
#

name: Test
run-name: Test ${{ github.run_number }} from ${{ github.actor }} on the ${{ github.ref_name }} ${{ github.ref_type }}

on:
  # Manual run via GitHub Repo > Actions > Test > Run workflow
  workflow_dispatch:
  # Automatically run on PRs that are targetting 'main'
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - content/**
      - prototypes/docker/**
      - src/*.ts
      - src/**/*.ts
      - deno.json
      - deno.lock

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: 'main'
          fetch-depth: 1
          show-progress: false
      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Run Tests
        run: ./task test

  docker:
    name: Docker
    runs-on: ubuntu-latest
    environment:
      name: ci-build
      deployment: false
    env: ${{ secrets }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          show-progress: false
      - name: Build Image
        env:
          SITE_BUILD_ID: ci-${{ github.run_id }}
        run: bash prototypes/docker/docker-build.sh
      - name: Smoke Test Image
        run: |
          docker run --detach \
            --name bcm-site-test \
            --env PORT=9000 \
            --publish 9000:9000 \
            bcm-site:latest

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/api/health/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs bcm-site-test
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:9000/ > /dev/null
          test "$(curl --fail --silent http://127.0.0.1:9000/api/version/)" = "ci-${{ github.run_id }}"

          for attempt in {1..30}; do
            status="$(docker inspect bcm-site-test --format '{{.State.Health.Status}}')"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ] || [ "$attempt" -eq 30 ]; then
              docker logs bcm-site-test
              exit 1
            fi
            sleep 1
          done
